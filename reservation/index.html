<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Réservation — Le Goia, Shisha Bar Kehl</title>
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#0B0A0C">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="/images/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/fonts/cormorant-garamond.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/inter.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/booking.css">
</head>
<body class="bpage">
  <svg width="0" height="0" class="sr-only" aria-hidden="true">
    <symbol id="i-instagram" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="12" r="4.2" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="17.3" cy="6.7" r="1.1" fill="currentColor"/></symbol>
    <symbol id="i-tiktok" viewBox="0 0 24 24"><path fill="currentColor" d="M16.6 3h-3.1v12.2a2.8 2.8 0 1 1-2.8-2.8c.3 0 .6 0 .9.1V9.3a6 6 0 1 0 5 5.9V9.1a7.3 7.3 0 0 0 4.3 1.4V7.4A4.3 4.3 0 0 1 16.6 3z"/></symbol>
    <symbol id="i-whatsapp" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2.2a9.7 9.7 0 0 0-8.4 14.6L2.3 21.7l5-1.3A9.7 9.7 0 1 0 12 2.2zm0 17.7c-1.5 0-3-.4-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8 8 0 1 1 12 19.9zm4.4-6c-.2-.1-1.4-.7-1.7-.8-.2-.1-.4-.1-.5.1l-.8 1c-.1.2-.3.2-.5.1a6.5 6.5 0 0 1-3.2-2.8c-.2-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.5-.4h-.5a.9.9 0 0 0-.6.3 2.7 2.7 0 0 0-.9 2c0 1.2.9 2.4 1 2.5.1.2 1.7 2.6 4.2 3.7 1.6.7 2.2.7 3 .6.5-.1 1.4-.6 1.6-1.1.2-.6.2-1 .1-1.1l-.6-.4z"/></symbol>
    <symbol id="i-phone" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" d="M6.6 3.5 9 3l1.6 4-2 1.3a10.5 10.5 0 0 0 5.1 5.1l1.3-2 4 1.6-.5 2.4a2 2 0 0 1-2.1 1.6C9.9 16.6 5.4 12.1 5 5.6a2 2 0 0 1 1.6-2.1z"/></symbol>
    <symbol id="i-pin" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.6" d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.4-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.3" fill="none" stroke="currentColor" stroke-width="1.6"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 7.5V12l3 2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
    <symbol id="i-mail" viewBox="0 0 24 24"><rect x="3" y="5.5" width="18" height="13" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="m3.5 7 8.5 6 8.5-6" fill="none" stroke="currentColor" stroke-width="1.6"/></symbol>
  </svg>
  <header class="nav is-scrolled nav--simple">
    <div class="nav__inner container">
      <a href="/" class="nav__logo" aria-label="Le Goia — accueil">Le <span>Goia</span></a>
      <div class="lang-switch" role="group" aria-label="Langue / Sprache">
        <button type="button" data-lang="fr" aria-pressed="true">FR</button>
        <button type="button" data-lang="de" aria-pressed="false">DE</button>
      </div>
    </div>
  </header>

  <main class="wiz container">
    <a class="wiz__back" id="wiz-back" href="/#reservation">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span data-i18n="wiz.back">Modifier la date et l'heure</span>
    </a>

    <!-- Créneau devenu complet : horaires de remplacement -->
    <div class="wiz__banner" id="wiz-banner" role="alert" hidden>
      <p id="wiz-banner-text"></p>
      <div class="slot-alternatives" id="wiz-alternatives"></div>
    </div>

    <!-- Étapes -->
    <ol class="steps" id="steps" aria-label="Étapes"></ol>

    <div class="wiz__grid">
      <div class="wiz__main">
        <!-- Étape : espace -->
        <section class="wiz__step" data-step="zone" hidden>
          <h1 class="wiz__title" data-i18n="wiz.zone.title">Choisissez votre espace</h1>
          <p class="wiz__intro" data-i18n="wiz.zone.intro"></p>
          <div class="opt-grid" id="zone-list" role="radiogroup"></div>
        </section>

        <!-- Étape : pré-commande de chichas -->
        <section class="wiz__step" data-step="preorder" hidden>
          <h1 class="wiz__title" data-i18n="wiz.pre.title">Pré-commandez vos chichas</h1>
          <p class="wiz__intro" data-i18n="wiz.pre.intro"></p>
          <p class="wiz__hint" id="pre-max"></p>
          <p class="field__error wiz__step-error" id="pre-error"></p>
          <div id="pre-list"></div>
        </section>

        <!-- Étape : coordonnées -->
        <section class="wiz__step" data-step="details" hidden>
          <h1 class="wiz__title" data-i18n="wiz.det.title">Vos coordonnées</h1>
          <p class="wiz__intro" data-i18n="wiz.det.intro"></p>
          <form class="wiz-card wiz-form" id="details-form" novalidate>
            <!-- Anti-spam : champ invisible, doit rester vide -->
            <input type="checkbox" name="botcheck" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
            <div class="field">
              <label for="f-name" data-i18n="booking.name">Nom</label>
              <input id="f-name" type="text" autocomplete="name" maxlength="80" required>
              <p class="field__error" id="f-name-err"></p>
            </div>
            <div class="field">
              <label for="f-phone" data-i18n="booking.phone">Téléphone</label>
              <input id="f-phone" type="tel" autocomplete="tel" inputmode="tel" maxlength="25" placeholder="+33 / +49 …" required>
              <p class="field__error" id="f-phone-err"></p>
            </div>
            <div class="field wiz-form__full">
              <label for="f-email" data-i18n="booking.email">Email</label>
              <input id="f-email" type="email" autocomplete="email" inputmode="email" maxlength="120" required>
              <p class="field__error" id="f-email-err"></p>
            </div>
            <div class="field wiz-form__full">
              <label for="f-message"><span data-i18n="booking.message">Message</span> <span class="muted" data-i18n="booking.optional">(optionnel)</span></label>
              <textarea id="f-message" rows="3" maxlength="500" data-i18n-placeholder="booking.messagePh"></textarea>
            </div>
            <div class="field field--check wiz-form__full">
              <input id="f-age" type="checkbox" required>
              <label for="f-age" data-i18n="booking.age">Je confirme avoir 18 ans ou plus.</label>
              <p class="field__error" id="f-age-err"></p>
            </div>
            <div class="field field--check wiz-form__full">
              <input id="f-privacy" type="checkbox" required>
              <label for="f-privacy" data-i18n-html="booking.privacy"></label>
              <p class="field__error" id="f-privacy-err"></p>
            </div>
            <button type="submit" hidden></button>
          </form>
        </section>

        <!-- Étape : vérification et confirmation -->
        <section class="wiz__step" data-step="review" hidden>
          <h1 class="wiz__title" data-i18n="wiz.rev.title">Vérifiez et confirmez</h1>
          <p class="wiz__intro" data-i18n="wiz.rev.intro"></p>
          <div class="wiz-card review" id="review"></div>
        </section>

        <div class="wiz__nav">
          <button type="button" class="btn btn--text" id="wiz-prev">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span data-i18n="wiz.prev">Précédent</span>
          </button>
          <button type="button" class="btn btn--gold btn--lg" id="wiz-next">
            <span id="wiz-next-label" data-i18n="wiz.next">Continuer</span>
            <svg class="icon" id="wiz-next-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
      </div>

      <!-- Récapitulatif (fixe à droite sur ordinateur) -->
      <aside class="recap" id="recap" aria-live="polite"></aside>
    </div>
  </main>

  <div class="toasts" id="toasts" aria-live="polite"></div>

  <footer class="footer footer--slim">
    <div class="container footer__inner">
      <p class="footer__adult"><span class="badge-18">18+</span> <span data-i18n="footer.adult">Réservé aux personnes majeures (18+)</span></p>
      <nav class="footer__legal" aria-label="Legal">
        <a href="/impressum.html" data-i18n="footer.impressum">Impressum</a>
        <a href="/datenschutz.html" data-i18n="footer.privacy">Datenschutz</a>
      </nav>
    </div>
  </footer>

  <script src="/js/config.js"></script>
  <script src="/js/rules.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/lang.js"></script>
  <script src="/js/wizard.js"></script>
</body>
</html>
