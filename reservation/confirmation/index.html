<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Votre réservation — Le Goia</title>
  <meta name="robots" content="noindex, nofollow">
  <!-- Le lien contient un jeton secret : on ne le transmet jamais aux autres sites -->
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#0B0A0C">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="/images/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/fonts/cormorant-garamond.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/inter.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/booking.css">
</head>
<body class="bpage">
  <svg width="0" height="0" class="sr-only" aria-hidden="true">
    <symbol id="i-instagram" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="12" r="4.2" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="17.3" cy="6.7" r="1.1" fill="currentColor"/></symbol>
    <symbol id="i-tiktok" viewBox="0 0 24 24"><path fill="currentColor" d="M16.6 3h-3.1v12.2a2.8 2.8 0 1 1-2.8-2.8c.3 0 .6 0 .9.1V9.3a6 6 0 1 0 5 5.9V9.1a7.3 7.3 0 0 0 4.3 1.4V7.4A4.3 4.3 0 0 1 16.6 3z"/></symbol>
    <symbol id="i-whatsapp" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2.2a9.7 9.7 0 0 0-8.4 14.6L2.3 21.7l5-1.3A9.7 9.7 0 1 0 12 2.2zm0 17.7c-1.5 0-3-.4-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8 8 0 1 1 12 19.9zm4.4-6c-.2-.1-1.4-.7-1.7-.8-.2-.1-.4-.1-.5.1l-.8 1c-.1.2-.3.2-.5.1a6.5 6.5 0 0 1-3.2-2.8c-.2-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.5-.4h-.5a.9.9 0 0 0-.6.3 2.7 2.7 0 0 0-.9 2c0 1.2.9 2.4 1 2.5.1.2 1.7 2.6 4.2 3.7 1.6.7 2.2.7 3 .6.5-.1 1.4-.6 1.6-1.1.2-.6.2-1 .1-1.1l-.6-.4z"/></symbol>
    <symbol id="i-phone" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" d="M6.6 3.5 9 3l1.6 4-2 1.3a10.5 10.5 0 0 0 5.1 5.1l1.3-2 4 1.6-.5 2.4a2 2 0 0 1-2.1 1.6C9.9 16.6 5.4 12.1 5 5.6a2 2 0 0 1 1.6-2.1z"/></symbol>
    <symbol id="i-pin" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.6" d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.4-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.3" fill="none" stroke="currentColor" stroke-width="1.6"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 7.5V12l3 2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
    <symbol id="i-mail" viewBox="0 0 24 24"><rect x="3" y="5.5" width="18" height="13" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="m3.5 7 8.5 6 8.5-6" fill="none" stroke="currentColor" stroke-width="1.6"/></symbol>
  </svg>
  <header class="nav is-scrolled nav--simple">
    <div class="nav__inner container">
      <a href="/" class="nav__logo" aria-label="Le Goia — accueil">Le <span>Goia</span></a>
      <div class="lang-switch" role="group" aria-label="Langue / Sprache">
        <button type="button" data-lang="fr" aria-pressed="true">FR</button>
        <button type="button" data-lang="de" aria-pressed="false">DE</button>
      </div>
    </div>
  </header>

  <main class="conf container">
    <p class="conf__status-msg" id="conf-loading" data-i18n="conf.loading">Chargement de votre réservation…</p>
    <p class="conf__status-msg" id="conf-error" hidden></p>

    <div id="conf-content" hidden>
      <div class="conf__hero">
        <span class="conf__check" id="conf-check" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
        <h1 class="conf__title" id="conf-title"></h1>
        <p class="conf__lead" id="conf-lead"></p>
        <p class="conf__ref" id="conf-ref"></p>
      </div>

      <article class="conf-card">
        <div class="conf-card__head">
          <div>
            <p class="conf-card__eyebrow" data-i18n="recap.title">Votre table</p>
            <p class="conf-card__title" id="conf-when"></p>
          </div>
          <span class="pill" id="conf-status"></span>
        </div>
        <div class="conf-card__grid">
          <div class="conf-card__block">
            <p class="conf-card__label" data-i18n="recap.when">Quand</p>
            <p class="conf-card__line"><svg class="icon" aria-hidden="true"><use href="#i-clock"/></svg><span id="conf-time"></span></p>
            <p class="conf-card__line conf-card__muted" id="conf-persons"></p>
          </div>
          <div class="conf-card__block">
            <p class="conf-card__label" data-i18n="recap.where">Où</p>
            <p class="conf-card__line"><svg class="icon" aria-hidden="true"><use href="#i-pin"/></svg><span id="conf-address"></span></p>
            <p class="conf-card__line conf-card__muted"><svg class="icon" aria-hidden="true"><use href="#i-phone"/></svg><a id="conf-phone" href="#"></a></p>
          </div>
        </div>
        <div class="conf-card__extra" id="conf-extra"></div>
        <div class="conf-card__foot">
          <p class="conf-card__foot-title" data-i18n="conf.idTitle">À présenter à l'entrée</p>
          <p data-i18n="conf.idText"></p>
        </div>
      </article>

      <p class="conf__note" id="conf-note"></p>
      <div class="conf__actions">
        <button type="button" class="btn btn--ghost" id="conf-cancel" hidden data-i18n="conf.cancel">Annuler la réservation</button>
        <a class="btn btn--gold" id="conf-home" href="/" data-i18n="conf.home">Retour à l'accueil</a>
      </div>
    </div>
  </main>

  <!-- Fenêtre de confirmation d'annulation (comme le bouton « Annuler » du site de location) -->
  <dialog class="dlg" id="cancel-dialog" aria-labelledby="dlg-title">
    <h2 class="dlg__title" id="dlg-title"></h2>
    <p class="dlg__text" data-i18n="dlg.text"></p>
    <div class="dlg__actions">
      <button type="button" class="btn btn--text" id="dlg-keep" data-i18n="dlg.keep">Conserver</button>
      <button type="button" class="btn btn--danger-solid" id="dlg-confirm" data-i18n="dlg.confirm">Confirmer l'annulation</button>
    </div>
  </dialog>

  <div class="toasts" id="toasts" aria-live="polite"></div>

  <footer class="footer footer--slim">
    <div class="container footer__inner">
      <p class="footer__adult"><span class="badge-18">18+</span> <span data-i18n="footer.adult">Réservé aux personnes majeures (18+)</span></p>
      <nav class="footer__legal" aria-label="Legal">
        <a href="/impressum.html" data-i18n="footer.impressum">Impressum</a>
        <a href="/datenschutz.html" data-i18n="footer.privacy">Datenschutz</a>
      </nav>
    </div>
  </footer>

  <script src="/js/config.js"></script>
  <script src="/js/rules.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/lang.js"></script>
  <script src="/js/confirmation.js"></script>
</body>
</html>
